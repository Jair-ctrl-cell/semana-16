{% extends "base.html" %}

{% block contenido %}

<div class="formulario">

    <h1>Crear cuenta</h1>

    <form method="POST">

        <label>Nombre</label>

        <input
            type="text"
            name="nombre"
            required
        >

        <label>Correo electrónico</label>

        <input
            type="email"
            name="email"
            required
        >

        <label>Contraseña</label>

        <input
            type="password"
            name="password"
            required
        >

        <button type="submit">
            Registrarse
        </button>

    </form>

</div>

{% endblock %}
